<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div>
    <h1>Raj Chowdhury</h1>
    <p>I am a Computer Science and Engineering Student</p>
    <p>My University is Premier University</p>       
    </div>

    <ol>
        <p> My favourite subjects are :</p>
        <li>C</li>
        <li>C++</li>
        <li>DSA</li>
        <li>Java</li>
       
    </ol>

    <form>
        <label>Name</label>
        <input type = "text" name = "name" placeholder="Enter your name" required>
        <br>
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br>
        <label>Password</label>
        <input type="password" name="password" required>
        <br>
        <label>Gender</label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female
        <br>
        <label>Date Of Birth</label>
        <input type="date" name="dob">
        <br>
        <label>Hobbies</label>
        <input type="checkbox" name="hobby" value="cycling">Cycling
        <input type="checkbox" name="hobby" value="coding">Competitive Programming
        <input type="checkbox" name="hobby" value="music">Music
        <input type="checkbox" name="hobby" value="football">Football
        <br>
        <button type="submit">Submit</button>

    </form>
</body>
</html>
